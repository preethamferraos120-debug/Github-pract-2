<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SkyFetch Weather Dashboard</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <h1>SkyFetch Weather Dashboard</h1>
      <p class="subtitle">Search any city to see current weather details.</p>

      <section class="search-panel" aria-label="City weather search">
        <label for="cityInput" class="visually-hidden">Enter a city name</label>
        <input
          id="cityInput"
          type="text"
          placeholder="e.g. London"
          autocomplete="off"
          aria-describedby="statusMessage"
        />
        <button id="searchButton" type="button">Search</button>
      </section>

      <p id="statusMessage" class="status" role="status" aria-live="polite"></p>

      <section id="weatherCard" class="weather-card hidden" aria-live="polite">
        <h2 id="cityName"></h2>
        <p><strong>Temperature:</strong> <span id="temperature"></span></p>
        <p><strong>Condition:</strong> <span id="condition"></span></p>
        <p><strong>Wind Speed:</strong> <span id="windSpeed"></span></p>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
